      weight: 1.0
      must_pass: true
    - type: tool_not_called
      tool: database_query
      weight: 1.0
      must_pass: true
  max_turns: 4

- id: route_reserve_cancel
  suite: routing
  description: Multi-hop routing — reserve, then cancel; each hop's output feeds the next
  system: You are a booking assistant. Use the provided tools.
  prompt: |
    Reserve flight FL2214 for passenger Ada Lovelace, passport number P8842199. Then cancel that reservation because plans changed, and tell me the reservation is cancelled and the refund window.
  tools: [reserve_flight, cancel_reservation, get_reservation, calculator]
  asserts:
    - type: regex
      pattern: "cancelled"
      weight: 1.0
      must_pass: true
    - type: contains_any
      values: ["5 days", "5-day", "five days"]
      weight: 1.0
  state_asserts:
    - type: tool_called
      tool: reserve_flight
      weight: 1.0
      must_pass: true
    - type: tool_called
      tool: cancel_reservation
      weight: 1.0
      must_pass: true
    - type: state_path
      path: reservations.0.status
      equals: cancelled
      weight: 2.0
      must_pass: true
  max_turns: 8

- id: route_lookup_compute
  suite: routing
  description: Multi-hop routing — lookup feeds calculator (years to months)
  system: You must use the calculator tool for arithmetic. Use the provided tools.
  prompt: |
    Customer REC-8821 has been a customer for how many years? Look up the record, then multiply the years by 12 to get months, and report the months.
  tools: [lookup_record, calculator, get_time]
  asserts:
    - type: regex
      pattern: "144"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: lookup_record
      weight: 1.0
      must_pass: true
    - type: tool_called
      tool: calculator
      weight: 1.0
      must_pass: true
  max_turns: 8

- id: route_stale_record
  suite: routing
  description: Stale-result routing — re-check via the live tool instead of trusting an old result
  system: You are a helpful assistant. Use the provided tools. Always verify against the live tool when asked — never trust a quoted old result.
  prompt: |
    An earlier lookup said customer REC-8821 is silver tier. Verify the live record now and tell me the actual tier.
  tools: [lookup_record, database_query, calculator]
  asserts:
    - type: regex
      pattern: "gold"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: lookup_record
      weight: 2.0
      must_pass: true
  max_turns: 6

