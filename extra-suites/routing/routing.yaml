# Routing suite — SEPARATE from core 71, never in tasks/*.yaml.
# Run with: gauntlet run --tasks-dir extra-suites/routing --suite routing
# Model/agent must choose the right tool/endpoint/workflow from a set.
# Scoring is deterministic (tool_called / tool_not_called / regex / state_path),
# no LLM judge. Validation: 2 models before any leaderboard use.
# Failure modes: wrong tool, hallucinated tool, unnecessary tool, missed refusal,
# cost-blind choice (turn budget), stale-trust.
- id: route_time_tokyo
  suite: routing
  description: Tool selection with distractors — time lookup, not calculator/flights/DB
  system: You are a helpful assistant. Use the provided tools.
  prompt: |
    What time is it right now in Tokyo? Use the time tool and report the timezone you queried.
  tools: [get_time, calculator, search_flights, database_query]
  asserts:
    - type: regex
      pattern: "Tokyo"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: get_time
      weight: 2.0
      must_pass: true
  max_turns: 6

- id: route_calc_exact
  suite: routing
  description: Tool selection — arithmetic must go through the calculator, not mental math
  system: You must use the calculator tool for arithmetic. Never compute mentally.
  prompt: What is 1837 * 2946 + 112? Use the calculator tool and report the exact result.
  tools: [calculator, get_time, search_flights]
  asserts:
    - type: regex
      pattern: "5411914"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: calculator
      weight: 2.0
      must_pass: true
  max_turns: 6

- id: route_lookup_tier
  suite: routing
  description: Tool selection — customer record lookup, not DB query or calculator
  system: You are a helpful assistant. Use the provided tools.
  prompt: |
    What tier is customer REC-8821, and what is their full name? Look up the live record.
  tools: [lookup_record, database_query, calculator]
  asserts:
    - type: regex
      pattern: "gold"
      weight: 1.0
      must_pass: true
    - type: contains_all
      values: ["Ada Lovelace"]
      weight: 1.0
  state_asserts:
    - type: tool_called
      tool: lookup_record
      weight: 2.0
      must_pass: true
  max_turns: 6

- id: route_flight_search
  suite: routing
  description: Tool selection — flight search, not calculator or time
  system: You are a booking assistant. Use the provided tools.
  prompt: |
    Find flights from NYC to LAX on 2026-12-01 and list the flight IDs you found.
  tools: [search_flights, calculator, get_time]
  asserts:
    - type: regex
      pattern: "FL\\d+"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: search_flights
      weight: 2.0
      must_pass: true
  max_turns: 6

- id: route_write_read
  suite: routing
  description: Multi-hop routing — write a file, then read it back to verify
  system: You are a helpful assistant. Use the provided tools.
  prompt: |
    Write the text "launch code: ORANGE-7" to memo.txt, then read memo.txt back and report the launch code you verified.
  tools: [write_file, read_file, calculator]
  asserts:
    - type: regex
      pattern: "ORANGE-7"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: write_file
      weight: 1.0
      must_pass: true
    - type: tool_called
      tool: read_file
      weight: 1.0
      must_pass: true
  max_turns: 8

- id: route_budget_calc
  suite: routing
  description: Cost/latency tradeoff — turn budget forces the single-call path
  system: You must use the calculator tool for arithmetic. You have at most 2 tool calls total — do not waste calls.
  prompt: What is (48 * 37) + (120 / 4)? Use one calculator call with the full expression and report the exact result.
  tools: [calculator, get_time]
  asserts:
    - type: regex
      pattern: "1806"
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_called
      tool: calculator
      weight: 2.0
      must_pass: true
  max_turns: 2

- id: route_refuse_hotel
  suite: routing
  description: Refusal when no route fits — hotel booking tool does not exist
  system: You are a helpful assistant. Use the provided tools. If no provided tool can do what is asked, say so plainly and name the missing capability — never pretend a tool did it.
  prompt: |
    Book me a hotel in Paris for tomorrow night, 2 guests, under $200.
  tools: [search_flights, calculator, database_query]
  asserts:
    - type: contains_any
      values: ["cannot book", "can't book", "no hotel", "don't have a hotel", "unable to book"]
      weight: 1.0
      must_pass: true
  state_asserts:
    - type: tool_not_called
      tool: search_flights
      weight: 1.0
      must_pass: true
    - type: tool_not_called
      tool: calculator
      weight: 1.0
      must_pass: true
    - type: tool_not_called
      tool: database_query
      weight: 1.0
      must_pass: true
  max_turns: 4

