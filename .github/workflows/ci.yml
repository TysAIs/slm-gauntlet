name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Hygiene gate (no personal data in repo)
        run: bash scripts/hygiene-check.sh

      - name: Lint
        # Scope: the shipped package and its tooling. `extra-suites/`, the
        # top-level one-off helper scripts and the vendored llama.cpp tree are
        # archival, not part of the installed package (see docs/AUDIT-LOGIC-v0.5.md).
        run: ruff check gauntlet scripts tests

      - name: Tests
        run: pytest -q
