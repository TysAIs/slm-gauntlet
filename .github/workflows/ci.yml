name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Hygiene gate (no personal data in repo)
        run: bash scripts/hygiene-check.sh

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q
