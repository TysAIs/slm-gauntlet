# Content routing & classification suite (epoch 0.6.0, design P2 section 2.2).
#
# The routing layer every agent pipeline starts with. Exact-match and set
# equality (as predicates) throughout; ordinals are anchored IN the prompt
# so the scale is a reading task, not a taste task. Phishing fixtures use
# only *.example lookalike domains. PII typing asks for TYPES only and its
# gate unit fails any answer that echoes a PII value.
#
# Batch table: one scenario prompt, ten per-position units (audit rule 5:
# N independent values = N units).
# Fixtures are synthetic; scripts/gen_classify_tasks.py recomputes the
# batch table and the multilabel set from the fixture data and asserts
# equality with this file.
# Validity proof: tests/test_validity_classify.py.
- id: cr_route4
  suite: classify
  description: Route one item to one of four departments (legal cues)
  prompt: 'Route this content item to exactly one department. Departments: support, sales, legal, hr.

    Reply with ONLY the department name.


    --- item ---

    "Our contract''s indemnity clause conflicts with the new vendor agreement; can someone review both before Friday?"

    --- end ---'
  asserts:
  - type: exact_match
    value: legal
  tier: standard
  max_tokens: 512
- id: cr_multilabel__set
  suite: classify
  description: Multi-label tagging — unit full tag set equality
  prompt: 'Assign ALL applicable tags to this post. Tag set: launch, hiring, support, pricing, event.

    Reply with ONLY a JSON array of the applicable tags.


    --- post ---

    "We are hiring two support engineers. Also, our pricing page was updated today with the new tiers."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and set(data) == {'hiring', 'pricing', 'support'}
  tier: standard
  max_tokens: 512
- id: cr_multilabel__hiring
  suite: classify
  description: Multi-label tagging — unit tag 'hiring' present
  prompt: 'Assign ALL applicable tags to this post. Tag set: launch, hiring, support, pricing, event.

