- id: cal_duration_math
  suite: calendar
  description: Meeting duration in minutes
  prompt: 'How long is this meeting? Answer with one line and nothing else:

    MINUTES: <total length in minutes>


    Meeting: 2026-03-10, starts 14:15, ends 16:45.'
  asserts:
  - type: line_value
    label: MINUTES
    equals: 150
  tier: standard
  max_tokens: 512
- id: cal_reminder_list
  suite: calendar
  description: Reminder moments — unit exact set
  prompt: 'List the reminders for this event. The event starts at 2026-03-12 15:00. Reminders are set for: 1 day
    before, 1 hour before, and 15 minutes before the start.

    Reply with ONLY a JSON array of the reminder moments, each formatted "YYYY-MM-DD HH:MM".'
  asserts:
  - type: predicate
    expr: data is not None and set(data) == {'2026-03-11 15:00', '2026-03-12 14:00', '2026-03-12 14:45'}
  tier: standard
  max_tokens: 512
- id: cal_vague_bounded
  suite: calendar
  description: 'Vague request bounded: the prompt demands the EARLIEST valid slot (Mon 2026-03-02 09:00);
    the assert grades that slot exactly'
  prompt: 'Today is Friday 2026-02-27. A customer asks for "a morning next week" for a 1-hour call, mornings meaning
    a start between 09:00 and 11:00, Monday to Friday.

    Pick the EARLIEST valid slot. Reply with ONLY a JSON object of exactly this shape:

    {"date": "<YYYY-MM-DD>", "start": "<HH:MM>"}

    "Next week" is the week starting Monday 2026-03-02.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('date') == '2026-03-02' and data.get('start') == '09:00'
  tier: hard
  max_tokens: 512
