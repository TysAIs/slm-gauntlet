# Calendar & scheduling suite (epoch 0.6.0, design P2 section 2.5).
#
# Scheduling is where "close enough" is wrong: timezones across DST,
# recurrence, interval reasoning, cascades. Every gold in this file was
# computed with python datetime/zoneinfo (2026-03-10: Berlin is CET
# UTC+1; New York is EDT UTC-4 because US DST starts 2026-03-08, a week
# before the EU switch - the deliberate trap of cal_tz_convert).
#
# cal_vague_bounded: the prompt says "Pick the EARLIEST valid slot", so the
# gold is the single earliest slot (Mon 2026-03-02 09:00) and the assert
# grades it exactly. (It previously accepted any of the 15 Mon-Fri morning
# slots, which contradicted the prompt; audit flag, 2026-11-09.)
# cal_free_slot: the 10:30-11:00 gap is only 30 minutes, so the earliest
# 60-minute slot is 12:00-13:00 (the prompt states back-to-back starts and
# ends against busy blocks are allowed).
#
# Fixtures are synthetic; scripts/gen_calendar_tasks.py recomputes every
# date/time gold and asserts equality with this file.
# Validity proof: tests/test_validity_calendar.py.
- id: cal_event_extract__title
  suite: calendar
  description: Event extraction — unit title
  prompt: 'Extract this event into a record. Reply with ONLY a JSON object of exactly this shape:

    {"title": "<event title>", "date": "<YYYY-MM-DD>", "start": "<HH:MM>", "location": "<location>"}


    --- event note ---

    "Team lunch with Ana Ruiz on 2026-03-12 at 12:30, at the Harbor Cafe."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('title') == 'Team lunch with Ana Ruiz'
  tier: standard
  max_tokens: 512
- id: cal_event_extract__date
  suite: calendar
  description: Event extraction — unit date
  prompt: 'Extract this event into a record. Reply with ONLY a JSON object of exactly this shape:

    {"title": "<event title>", "date": "<YYYY-MM-DD>", "start": "<HH:MM>", "location": "<location>"}


