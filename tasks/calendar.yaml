- id: cal_tz_convert__utc
  suite: calendar
  description: Timezone conversion — unit UTC (Berlin is CET, UTC+1, on 2026-03-10)
  prompt: 'Convert this meeting time. The meeting is at 15:00 on 2026-03-10 in Berlin (Europe/Berlin).

    Reply with ONLY a JSON object of exactly this shape:

    {"utc": "<YYYY-MM-DD HH:MM>", "new_york": "<YYYY-MM-DD HH:MM>"}

    utc is the same moment in UTC; new_york is the same moment in New York (America/New_York).'
  asserts:
  - type: predicate
    expr: data is not None and data.get('utc') == '2026-03-10 14:00'
  tier: hard
  max_tokens: 512
- id: cal_tz_convert__new_york
  suite: calendar
  description: Timezone conversion — unit New York (EDT, UTC-4, after the Mar 8 US switch)
  prompt: 'Convert this meeting time. The meeting is at 15:00 on 2026-03-10 in Berlin (Europe/Berlin).

    Reply with ONLY a JSON object of exactly this shape:

    {"utc": "<YYYY-MM-DD HH:MM>", "new_york": "<YYYY-MM-DD HH:MM>"}

    utc is the same moment in UTC; new_york is the same moment in New York (America/New_York).'
  asserts:
  - type: predicate
    expr: data is not None and data.get('new_york') == '2026-03-10 10:00'
  tier: hard
  max_tokens: 512
- id: cal_recurrence__rrule
  suite: calendar
  description: Recurrence — unit exact RRULE string
  prompt: 'Write the recurrence rule for this event and its first occurrences.

    The event runs every week on Monday, starting Monday 2026-03-02, for 6 occurrences in total.

    Reply with ONLY a JSON object of exactly this shape:

    {"rrule": "<the RRULE string>", "first_three": ["<YYYY-MM-DD>", "<YYYY-MM-DD>", "<YYYY-MM-DD>"]}

    The RRULE must use FREQ=WEEKLY, BYDAY=MO and COUNT=6, in that component order, like "RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=6".'
  asserts:
  - type: predicate
    expr: data is not None and data.get('rrule') == 'RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=6'
  tier: standard
  max_tokens: 512
- id: cal_recurrence__dates
  suite: calendar
  description: Recurrence — unit first three occurrence dates as a set
  prompt: 'Write the recurrence rule for this event and its first occurrences.

    The event runs every week on Monday, starting Monday 2026-03-02, for 6 occurrences in total.

    Reply with ONLY a JSON object of exactly this shape:

    {"rrule": "<the RRULE string>", "first_three": ["<YYYY-MM-DD>", "<YYYY-MM-DD>", "<YYYY-MM-DD>"]}

    The RRULE must use FREQ=WEEKLY, BYDAY=MO and COUNT=6, in that component order, like "RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=6".'
  asserts:
  - type: predicate
    expr: data is not None and set(data.get('first_three', [])) == {'2026-03-02', '2026-03-09', '2026-03-16'}
  tier: standard
  max_tokens: 512
- id: cal_free_slot
  suite: calendar
  description: 'Earliest free 60-minute slot (interval reasoning: the 10:30-11:00 gap is only 30 minutes, so the
    first full hour is 12:00-13:00)'
  prompt: 'Find the EARLIEST free slot for a new 60-minute meeting on 2026-03-10, inside working hours 09:00-17:00.

    A slot may start exactly when a busy block ends and end exactly when the next one begins.

    Busy times that day: 09:00-10:30, 11:00-12:00, 13:30-15:00.

    Reply with ONLY a JSON object of exactly this shape:

    {"start": "<HH:MM>", "end": "<HH:MM>"}'
  asserts:
  - type: predicate
    expr: data is not None and data.get('start') == '12:00' and data.get('end') == '13:00'
  tier: standard
  max_tokens: 512
- id: cal_conflict_find__set
  suite: calendar
  description: Overlap detection — unit exact pair set
  prompt: 'Find every pair of events that overlap in time. Event times (same day, 2026-03-10):

    A: 09:00-10:00

    B: 09:30-10:30

    C: 11:00-12:00

    D: 11:30-12:30

    E: 13:00-14:00

    Reply with ONLY a JSON array of the overlapping pairs, each pair a two-element array of ids, like [["A", "B"]].'
  asserts:
  - type: predicate
    expr: data is not None and {tuple(sorted(p)) for p in data} == {('A', 'B'), ('C', 'D')}
  tier: standard
  max_tokens: 512
- id: cal_conflict_find__count
  suite: calendar
  description: Overlap detection — unit exactly two pairs
  prompt: 'Find every pair of events that overlap in time. Event times (same day, 2026-03-10):

    A: 09:00-10:00

    B: 09:30-10:30

    C: 11:00-12:00

    D: 11:30-12:30

    E: 13:00-14:00

    Reply with ONLY a JSON array of the overlapping pairs, each pair a two-element array of ids, like [["A", "B"]].'
  asserts:
  - type: predicate
    expr: data is not None and len(data) == 2
  tier: standard
  max_tokens: 512
- id: cal_reschedule_cascade__y
  suite: calendar
  description: Reschedule cascade — unit Y follows X
  prompt: 'Event X moves, and everything depending on it shifts with it. The rules:

    - Y starts when X ends (Y follows X directly).

    - Z starts 30 minutes after Y ends.

    Current schedule (2026-03-10):

    X: 10:00-11:00

    Y: 11:00-12:00

    Z: 12:30-13:30

    X moves to 14:00-15:00 (same length). Reply with ONLY a JSON object of exactly this shape:

    {"X": ["<HH:MM>", "<HH:MM>"], "Y": ["<HH:MM>", "<HH:MM>"], "Z": ["<HH:MM>", "<HH:MM>"]}

    giving the NEW start and end of each event.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('Y') == ['15:00', '16:00']
  tier: hard
  max_tokens: 512
- id: cal_reschedule_cascade__z
  suite: calendar
  description: Reschedule cascade — unit Z sits 30 min after Y (2-deep)
  prompt: 'Event X moves, and everything depending on it shifts with it. The rules:

    - Y starts when X ends (Y follows X directly).

    - Z starts 30 minutes after Y ends.

    Current schedule (2026-03-10):

    X: 10:00-11:00

    Y: 11:00-12:00

    Z: 12:30-13:30

    X moves to 14:00-15:00 (same length). Reply with ONLY a JSON object of exactly this shape:

    {"X": ["<HH:MM>", "<HH:MM>"], "Y": ["<HH:MM>", "<HH:MM>"], "Z": ["<HH:MM>", "<HH:MM>"]}

    giving the NEW start and end of each event.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('Z') == ['16:30', '17:30']
  tier: hard
  max_tokens: 512
- id: cal_reschedule_cascade__x
  suite: calendar
  description: Reschedule cascade — unit X at its new time
  prompt: 'Event X moves, and everything depending on it shifts with it. The rules:

    - Y starts when X ends (Y follows X directly).

    - Z starts 30 minutes after Y ends.

    Current schedule (2026-03-10):

    X: 10:00-11:00

    Y: 11:00-12:00

    Z: 12:30-13:30

    X moves to 14:00-15:00 (same length). Reply with ONLY a JSON object of exactly this shape:

    {"X": ["<HH:MM>", "<HH:MM>"], "Y": ["<HH:MM>", "<HH:MM>"], "Z": ["<HH:MM>", "<HH:MM>"]}

    giving the NEW start and end of each event.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('X') == ['14:00', '15:00']
  tier: hard
  max_tokens: 512
