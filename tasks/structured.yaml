# Structured-output suite: strict schema compliance, repair, extraction.
# All scoring deterministic via json_schema/regex asserts.
- id: struct_nested_json
  suite: structured
  description: Nested JSON object with arrays, enums and a computed total, no extra keys
  prompt: |
    Output ONLY valid JSON (no other text, no code fence) describing this order:
    customer "J. Doe", items: 2x widget ($9.99 each), 1x gadget ($24.50),
    shipping "express", paid with "credit_card".
    Add a "total" key equal to the sum of qty * price over all items (two decimals).
    Schema: {"customer": string, "items": [{"name": string, "qty": integer, "price": number}], "shipping": "standard"|"express", "payment": "credit_card"|"paypal", "total": number}
  asserts:
    - type: predicate
      expr: >-
        isinstance(data, dict) and sorted(data) == ['customer', 'items', 'payment', 'shipping', 'total']
        and isinstance(data.get('items'), list) and len(data['items']) == 2
        and abs(float(data.get('total', -1)) - 44.48) < 0.005
        and data.get('shipping') == 'express' and data.get('payment') == 'credit_card'
  max_tokens: 512

- id: struct_json_repair
  suite: structured
  description: Fix JSON with single quotes, a trailing comma and a missing brace
  prompt: |
    This JSON is malformed in three ways. Fix it and output ONLY the corrected JSON,
    keeping all values and their types:
    {'name': 'widget', 'count': 3, 'tags': ['a', 'b',], 'price': 4.5
  asserts:
    - type: predicate
      expr: >-
        isinstance(data, dict) and sorted(data) == ['count', 'name', 'price', 'tags']
        and data.get('name') == 'widget' and int(data.get('count', -1)) == 3
        and data.get('tags') == ['a', 'b'] and abs(float(data.get('price', -1)) - 4.5) < 0.005

- id: struct_csv_extract
  suite: structured
  description: Extract tabular data from prose into CSV
  prompt: |
    Convert to CSV with header "name,score". Output only the CSV.
    Alice scored 91, Bob scored 85, and Carol got 78 on the test.
  asserts:
    - type: contains_all
      values: ["name,score", "Alice,91", "Bob,85", "Carol,78"]

- id: struct_signature_extract
  suite: structured
  description: Extract function signature from docstring prose
  prompt: |
    What is the exact function signature described? Answer with only the signature line.
    A function named calculate_discount that takes price (a float), tier (a string,
    defaulting to "basic") and applies (a boolean, defaulting to False).
  asserts:
    - type: regex
      pattern: "(def )?calculate_discount\\(.*price.*tier.*=.*[\"']basic[\"'].*applies.*=.*False"
      weight: 2.0
      must_pass: true

- id: struct_regex_gen
  suite: structured
  description: Write a regex that matches the three phone formats and rejects near-misses
  prompt: |
    Write a single Python regex that matches these three phone formats and nothing else:
    555-123-4567, (555) 123-4567, 5551234567.
    It must reject 555-12-3456, 55551234567 and abc.
    The pattern will be tested with re.fullmatch, so anchor it with ^ and $.
    Format your answer as: PATTERN: <regex>
  asserts:
    - type: predicate
      expr: >-
        (lambda m: bool(m)
         and all(re.fullmatch(m.group(1), s) for s in ['555-123-4567', '(555) 123-4567', '5551234567'])
         and not any(re.fullmatch(m.group(1), s) for s in ['555-12-3456', '55551234567', 'abc'])
        )(re.search(r'PATTERN:\s*(\S.*?)\s*$', out, re.M))
  max_tokens: 256

- id: struct_json_array_sort
  suite: structured
  description: Transform data to sorted JSON array of objects
  prompt: |
    Output ONLY a JSON array of objects with keys "city" and "population",
    sorted by population descending, from this data:
    Paris has 2.1 million people. Berlin has 3.6 million. Rome has 2.8 million.
    Use numbers (millions) for population.
  asserts:
    - type: json_schema
      schema:
        type: array
        items:
          type: object
          properties: {city: {type: string}, population: {type: number}}
          required: [city, population]

- id: struct_yaml_shape
  suite: structured
  description: Convert JSON to a specific YAML-like key layout
  prompt: |
    Reformat this data as indented "key: value" lines (2-space indent, nested items
    indented under parents), outputting nothing else:
    {"server": {"host": "0.0.0.0", "port": 8080}, "debug": true}
  asserts:
    - type: contains_all
      values: ["server:", "host:", "port: 8080", "debug: true"]

- id: struct_strict_json_only
  suite: structured
  description: Three-key JSON with no prose wrapper and no code fence (instruction discipline)
  prompt: >-
    Output a JSON object with exactly three keys: "ok" set to true, "count" set to 2
    and "label" set to "gauntlet". Output nothing except the JSON object itself: no
    prose, no code fence, no trailing explanation.
  asserts:
    - type: predicate
      expr: >-
        isinstance(data, dict) and sorted(data) == ['count', 'label', 'ok']
        and data.get('ok') is True and data.get('count') == 2 and data.get('label') == 'gauntlet'
        and out.strip().startswith('{') and out.strip().endswith('}')
  max_tokens: 64
