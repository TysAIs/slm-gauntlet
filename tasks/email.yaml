  prompt: 'Build a digest of these ten short emails. Reply with ONLY a JSON object of exactly this shape:

    {"records": [{"id": "<id>", "category": "billing" or "scheduling" or "notice", "amount": <number or null>, "date":
    "<YYYY-MM-DD or null>"}, ...], "top_urgent": ["<id>", "<id>", "<id>"]}

    Rules: category is what the email is mainly about; amount is the money figure the email asks about or reports
    (null if none); date is the due date or event date the email names (null if none). top_urgent lists the three
    emails with the soonest dates, soonest first; if two dates tie, the lower email number wins. Emails with no
    date cannot be in top_urgent.


    [e1] Invoice INV-101 from a vendor: total 310.00, due 2026-03-12.

    [e2] Team lunch moved to 2026-03-15; bring your badge.

    [e3] Reminder: invoice INV-102 payment of 98.50 is overdue; it was due 2026-03-01.

    [e4] Your password expires soon; no action date given.

    [e5] Workshop registration confirmed for 2026-03-20.

    [e6] Credit note: we refunded 45.00 to your account on 2026-03-05.

    [e7] Invoice INV-103: total 720.25, due 2026-03-12.

    [e8] The office will be closed for a holiday; reopening date to be announced.

    [e9] Meeting request: design review on 2026-03-18.

    [e10] Subscription renewed; receipt total 59.99, charged 2026-03-03.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('top_urgent') == ['e3', 'e10', 'e6']
  tier: standard
  max_tokens: 1024
