- id: em_priority_order
  suite: email
  description: Email priority ranking — unit full order
  prompt: "Rank these eight inbox emails from most urgent (position 1) to least urgent (position 8).\nUrgency policy,\
    \ applied in this order:\n  P1: an email with a deadline within 48 hours of now (now = 2026-03-09 09:00) outranks\
    \ everything else.\n  P2: among the rest, an email from a VIP sender (marked VIP) outranks a non-VIP email.\n\
    \  P3: among emails still tied, one containing any of the keywords OUTAGE, SECURITY, CANCELLED outranks one\
    \ without.\n  P4: any emails still tied keep their inbox order (lower email number first).\n\n[e1] From: monitoring@ops.example\
    \ - \"OUTAGE: the staging cluster is down.\" (no deadline)\n[e2] From: carol@northwind.example (VIP) - \"Please\
    \ review the draft agenda when you can.\" (no deadline)\n[e3] From: dan@northwind.example - \"Reminder: the\
    \ Q1 report is due 2026-03-10 17:00.\"\n[e4] From: erin@northwind.example - \"SECURITY: please rotate your badge\
    \ PIN this month.\" (no deadline)\n[e5] From: frank@northwind.example - \"Lunch menu for next week is posted.\"\
    \ (no deadline)\n[e6] From: gwen@northwind.example (VIP) - \"CANCELLED: my flight, rebooking options inside.\"\
    \ (no deadline)\n[e7] From: hank@northwind.example - \"Please send the signed form by 2026-03-25.\"\n[e8] From:\
    \ ivy@northwind.example - \"Happy birthday to Marcus in #general!\" (no deadline)\n\nReply with ONLY a JSON\
    \ array of the eight ids in ranked order, e.g. [\"e3\", \"e1\", ...]."
  asserts:
  - type: predicate
    expr: data == ['e3', 'e6', 'e2', 'e1', 'e4', 'e5', 'e7', 'e8']
  tier: standard
  max_tokens: 1024
