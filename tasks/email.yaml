# Email agent suite (epoch 0.6.0, design P2 section 1).
#
# The job: a local model on a mailbox - triage, extract, reconcile, draft,
# route - scored 100% deterministically with the existing assert vocabulary.
# No LLM judge anywhere. Drafts use the RubricAssert pattern (design 1.3):
# per-point paraphrase sets, an entity gate expressed as a predicate
# (any amount/date/name token in the draft that is absent from the source
# gates the task to 0), format locks and published tone lexicons.
#
# Sub-answer convention (0.5.1): one scenario prompt, one task per
# independent value, id <scenario>__<unit>, exactly one gating assert per
# unit; composite work products (drafts, file-state chains) gate with
# must_pass on the structural assert instead.
#
# Fixtures are synthetic and reproducible: scripts/gen_email_tasks.py
# recomputes every ground truth below from the fixture data and asserts
# equality, so a hand-edit that drifts from the fixture fails loudly.
# min_tier markers: em_long_thread_brief is T2, em_long_inbox_search is
# T3 (the Task schema has no min_tier field yet - the tier lives in the
# task id family + this header + the generator; the static file carries
# small exemplars, full sizes come from the generator with --size).
#
# Two design sketches are realised against the CURRENT sandbox (which has
# no mailbox tools - see the build report): em_route_flag_tools routes by
# writing routing.json (file state graded), and em_multiturn_assistant is
# the 3-step chain triage file -> reply draft -> send log, conjunctive on
# file state. Both keep the design's outcomes (right folders, draft
# addressed to the billing sender, exactly one send) as the graded facts.
#
# Validity proof: tests/test_validity_email.py (GOLD full score, NEAR-MISS
# rejected, per unit).
- id: em_triage_buckets__spam
  suite: email
  description: Email triage buckets — unit spam (precedence-ordered policy)
  prompt: "You are the mailbox agent for a small operations team. Today is Monday 2026-03-09.\nSort the six emails\
    \ below into buckets using these rules, applied in this exact precedence order (first matching rule wins):\n\
    \  R1: the sender domain is on the blocklist (promo-blast.example) -> spam\n  R2: the email cancels a meeting\
    \ with a VIP client -> urgent\n  R3: the email is from a vendor (sender domain ends in .vendor.example) asking\
    \ for payment or sending an invoice / payment reminder -> billing\n  R4: anything else -> other\n\n[e1] From:\
    \ billing@acme-supply.vendor.example - \"Your March invoice INV-2041 is ready. Total due 842.10, due 2026-03-20.\"\
    \n[e2] From: priya@northwind.example - \"URGENT: I must cancel tomorrow's contract review with Harbor Legal,\
    \ our VIP client. Please reschedule.\"\n[e3] From: deals@promo-blast.example - \"Invoice for your premium listing!\
    \ Pay now to keep your discount.\"\n[e4] From: sam@northwind.example - \"Notes from Friday's standup are attached.\
    \ Nothing needed from you.\"\n[e5] From: ap@globex.vendor.example - \"Reminder: payment for PO-881 is overdue\
    \ by 42 days. Amount outstanding 1299.00.\"\n[e6] From: lee@northwind.example - \"The office printer on floor\
    \ 3 is jammed again.\"\n\nReply with ONLY a JSON object of exactly this shape, email ids as strings:\n{\"spam\"\
    : [...], \"billing\": [...], \"urgent\": [...], \"other\": [...]}\nList each id in the order the emails appear\
    \ above."
  asserts:
  - type: predicate
    expr: data is not None and data.get('spam') == ['e3']
  tier: standard
  max_tokens: 1024
