- id: em_extract_meeting__date
  suite: email
  description: Meeting extraction — unit date (next Tuesday from a stated Friday)
  prompt: 'Today is Friday 2026-03-06. Read this invite and reply with ONLY a JSON object of exactly this shape:

    {"date": "<YYYY-MM-DD>", "time_utc": "<HH:MM in UTC, 24-hour>", "attendees": ["<email>", ...], "location": "<place>"}


    --- invite ---

    Hi team,


    Let''s meet next Tuesday at 3pm Berlin time to review the launch checklist.

    Attendees: ana@example.com, bo@example.com, cy@example.com.

    We''ll meet in Room 4B, Harbor Office.


    Ana

    --- end ---


    "Next Tuesday" is counted from today (Friday 2026-03-06). Berlin in March, before the last Sunday of the month,
    is on CET (UTC+1). Give the start time converted to UTC.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('date') == '2026-03-10'
  tier: standard
  max_tokens: 1024
