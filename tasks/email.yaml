- id: em_multiturn_assistant
  suite: email
  description: 'Mailbox assistant chain: triage file -> reply draft -> send log (conjunctive file state)'
  prompt: 'You are the mailbox assistant for this inbox:


    [e1] From: ap@acme-supply.vendor.example - "Invoice INV-88: total due 460.00 by 2026-03-16."

    [e2] From: sam@northwind.example - "Standup notes attached, nothing needed."


    Do these three steps in order:

    1. Write a file triage.json (write_file tool) whose content is ONLY this JSON object, with the two ids in inbox
    order: {"actionable": ["e1"]}

    2. Write a file reply_draft.txt (write_file tool) whose content is a short reply to the billing email e1. The
    reply must: acknowledge invoice INV-88, state its total (460.00) and due date (2026-03-16), and be addressed
    to ap@acme-supply.vendor.example (start the draft with "To: ap@acme-supply.vendor.example"). Use only facts
    from the inbox.

    3. Write a file sent_log.json (write_file tool) whose content is ONLY this JSON object: {"sent": ["reply_draft.txt"],
    "count": 1}

    Then reply with the single word: done'
  asserts:
  - type: exact_match
    value: done
  tier: hard
  max_tokens: 1024
  state_asserts:
  - type: file_lines
    path: triage.json
    lines:
    - '{"actionable": ["e1"]}'
    must_pass: true
    weight: 1.0
  - type: file_content
    path: reply_draft.txt
    contains: 'To: ap@acme-supply.vendor.example'
    weight: 1.0
  - type: file_content
    path: reply_draft.txt
    contains: INV-88
    weight: 1.0
  - type: file_content
    path: reply_draft.txt
    contains: '460.00'
    weight: 1.0
  - type: file_content
    path: reply_draft.txt
    contains: '2026-03-16'
    weight: 1.0
  - type: file_lines
    path: sent_log.json
    lines:
    - '{"sent": ["reply_draft.txt"], "count": 1}'
    must_pass: true
    weight: 1.0
  tools:
  - write_file
