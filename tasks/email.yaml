- id: em_draft_accept
  suite: email
  description: 'Draft: accept an invite (RubricAssert — points + entity gate + format)'
  prompt: 'Here is a meeting invite you received:


    --- invite ---

    Subject: Launch checklist review

    When: Tuesday 2026-03-10 at 14:00

    Where: Room 4B, Harbor Office

    From: ana@example.com

    ---


    Write a reply email that accepts the invite. Your reply must:

    - confirm the day and date (Tuesday 2026-03-10), the time (14:00) and the place (Room 4B, Harbor Office), using
    those exact details;

    - ask Ana to share the agenda before the meeting (write "share the agenda", "send the agenda" or "share the
    talking points");

    - use ONLY details that appear in the invite above - invent nothing (no other dates, times, places or people);

    - be between 30 and 120 words;

    - contain no bracketed placeholders like [Name];

    - end with a sign-off line starting with "Best regards" or "Kind regards" or "Regards".

    Write only the email body.'
  asserts:
  - type: contains_any
    values:
    - share the agenda
    - send the agenda
    - share the talking points
    weight: 1.0
  - type: contains_all
    values:
    - Tuesday 2026-03-10
    - '14:00'
    - Room 4B, Harbor Office
    weight: 2.0
  - type: predicate
    expr: not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+', out) if t not in ('2026-03-10',
      '14:00')]
    weight: 2.0
    must_pass: true
  - type: predicate
    expr: 30 <= len(out.split()) <= 120
    weight: 1.0
  - type: regex
    pattern: (?s)(Best regards|Kind regards|Regards)\s*,?\s*(\n|$)
    weight: 1.0
  - type: predicate
    expr: re.search(r'\[[A-Za-z ]{1,40}\]', out) is None
    weight: 1.0
  tier: standard
  max_tokens: 512
- id: em_draft_decline_reschedule
  suite: email
  description: 'Draft: decline + reschedule (RubricAssert — slots gate + tone lexicons)'
  prompt: 'Here is a meeting invite you received, and your availability:


    --- invite ---

    Subject: Vendor demo

    When: Wednesday 2026-03-11 at 10:00

    Where: Room 2A, Harbor Office

    From: bo@example.com

    ---

    Your free slots this week: Thursday 2026-03-12 at 09:00; Thursday 2026-03-12 at 13:30; Friday 2026-03-13 at
    11:00.


    Write a reply email that declines the Wednesday slot and proposes exactly two of your free slots instead. Your
    reply must:

    - thank Bo for the invite (use "thank" or "thanks");

    - include a softener or apology ("sorry", "unfortunately", "afraid" or "regret");

    - propose exactly two of the free slots listed above, writing each exactly as listed (e.g. "Thursday 2026-03-12
    at 09:00") - proposing any other time is a failure;

    - NOT contain any of these blame phrases: "your fault", "you failed", "incompetent", "careless", "unacceptable";

    - use ONLY details from the invite and the availability list - invent nothing;

    - be between 30 and 120 words.

    Write only the email body.'
  asserts:
  - type: contains_any
    values:
    - thank
    - thanks
    - Thank
    - Thanks
    weight: 1.0
  - type: contains_any
    values:
    - sorry
    - unfortunately
    - afraid
    - regret
    - Sorry
    - Unfortunately
    weight: 1.0
  - type: predicate
    expr: sum(1 for s in ['Thursday 2026-03-12 at 09:00', 'Thursday 2026-03-12 at 13:30', 'Friday 2026-03-13 at
      11:00'] if s in out) == 2 and not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+',
      out) if t not in ('2026-03-11', '10:00', '2026-03-12', '09:00', '13:30', '2026-03-13', '11:00')]
    weight: 2.0
    must_pass: true
  - type: predicate
    expr: not any(b in out.lower() for b in ['your fault', 'you failed', 'incompetent', 'careless', 'unacceptable'])
    weight: 1.0
  - type: predicate
    expr: 30 <= len(out.split()) <= 120
    weight: 1.0
  tier: standard
  max_tokens: 512
- id: em_draft_answer_facts
  suite: email
  description: 'Draft: answer from the thread only (RubricAssert — entity gate carries the task)'
  prompt: 'A customer asked a question in this thread. Draft a reply that answers it using ONLY facts stated in
    the thread. If the thread never states something, do not invent it - leave it out.


    --- thread ---

    Customer (Cy): "Three questions about the model K-200 drive: (1) what is the warranty period, (2) what firmware
    version does it ship with, (3) what does it cost?"

    Support note (internal summary of the product sheet): "K-200: warranty is 24 months. Ships with firmware 4.2.
    Operating range -10 to 50 C. Price is not on the sheet; sales sets pricing per quote."

    --- end ---


    Your draft must:

    - state the warranty period (24 months) - "24 months", "two years" or "2 years" all count;

    - state the firmware version (4.2) - write "firmware 4.2" or "version 4.2";

    - mention the operating range (-10 to 50 C) - write "operating range" or "rated for";

    - NOT state any price or cost figure, and not claim a price is included or free;

    - invent no other numbers, dates or names beyond what the thread states;

    - be between 30 and 140 words.

    Write only the email body.'
  asserts:
  - type: contains_any
    values:
    - 24 months
    - two years
    - 2 years
    weight: 1.0
  - type: contains_any
    values:
    - firmware 4.2
    - version 4.2
    weight: 1.0
  - type: contains_any
    values:
    - operating range
    - rated for
    weight: 1.0
  - type: predicate
    expr: not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+|\d+', out) if t.replace(',',
      '') not in ('24', '4.2', '10', '50', '200')]
    weight: 2.0
    must_pass: true
  - type: predicate
    expr: 'not re.search(r''\$\s?\d|\d+\s?(dollars|usd)\b'', out.lower()) and (not re.search(r''\b(price|cost|pricing)\b'', out.lower()) or re.search(r''\b(price|cost|pricing)\b[^.!?\n]{0,80}?\bper quote\b'', out.lower()) or re.search(r''(?:\bnot\b|\bno\b|\bnever\b|\bcannot\b|\bwithout\b|\bnothing\b|\bnone\b|\bcan\Wt\b|\bcouldn\Wt\b|\bwon\Wt\b|\bdon\Wt\b)[^.!?\n]{0,80}?\b(price|cost|pricing)\b'', out.lower()) or re.search(r''\b(price|cost|pricing)\b[^.!?\n]{0,80}?(?:\bnot\b|\bno\b|\bnever\b|\bcannot\b|\bwithout\b|\bnothing\b|\bnone\b|\bcan\Wt\b|\bcouldn\Wt\b|\bwon\Wt\b|\bdon\Wt\b)'', out.lower()))'
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: 30 <= len(out.split()) <= 140
    weight: 1.0
  tier: hard
  max_tokens: 512
