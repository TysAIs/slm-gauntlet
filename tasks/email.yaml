- id: em_action_items__owners
  suite: email
  description: Action items — unit owners (live asks only)
  prompt: 'Read this manager email and extract the LIVE action items: asks that still need doing. One ask below
    is explicitly marked as already done - leave it out.

    Reply with ONLY a JSON object of exactly this shape:

    {"owners": ["<name>", ...], "actions": ["<short action>", ...], "dues": ["<YYYY-MM-DD>", ...]}

    The three lists are parallel: entry i of each list belongs to the same action item, in the order the asks appear
    in the email.


    --- email ---

    Team,


    Four things:

    1. Ana - please send the vendor shortlist to legal by 2026-03-13.

    2. Bo - renew the staging certificate before it expires on 2026-03-20.

    3. Cy - the budget spreadsheet is DONE already, thanks, no action needed.

    4. Ana - book the venue for the April offsite by 2026-03-27.


    Thanks,

    Ren

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('owners') == ['Ana', 'Bo', 'Ana']
  tier: standard
  max_tokens: 1024
