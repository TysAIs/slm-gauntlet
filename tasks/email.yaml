- id: em_long_thread_brief__decision
  suite: email
  description: Long thread brief (T2 exemplar, min_tier T2) — unit decision
  prompt: 'Read this email thread about the Harbor Portal project and brief it.


    [m1] Ana: Kicking off the Harbor Portal thread. Budget proposal: 40000 for the spring work.

    [m2] Bo: Sharing the draft timeline; review pass is Friday.

    [m3] Cy: [CONFIDENTIAL] Do not circulate: the reserve code is ZX-9917.

    [m4] Ana: Vendor quotes are in; comparing two options this week.

    [m5] Bo: Question: do we need the extra test rigs? Still open.

    [m6] Cy: Scheduling note: the review moved to next Tuesday.

    [m7] Ana: Question: who owns the launch checklist? Still open.

    [m8] Dana: Interim budget note: hold spending at 40000 until the review.

    [m9] Bo: Draft agenda for the review is attached.

    [m10] Cy: The venue confirmed the main hall for the demo day.

    [m11] Ana: Question: can we get a second demo unit? Still open.

    [m12] Dana: Decision: we proceed with vendor option B for the portal build.

    [m13] Bo: Noted. Final deadline for delivery: 2026-04-30.

    [m14] Ana: Budget amendment: the approved budget is now 45500, replacing the earlier figure.

    [m15] Cy: Reminder: the reserve code stays internal.

    [m16] Bo: Summary draft circulating for comments.

    [m17] Ana: Question: what is the support rota for launch week? Still open.

    [m18] Dana: Wrap-up: decisions are logged; open questions carry over.

    [m19] Bo: Final deadline reconfirmed: delivery by 2026-04-30.

    [m20] Ana: Closing the thread. Thanks all.


    Reply with ONLY a JSON object of exactly this shape:

    {"decision": "<the decision in the thread, short>", "open_questions": ["<question topic>", ...], "final_deadline":
    "<YYYY-MM-DD>", "budget_final": <number>}

    Rules: budget_final is the budget in force at the END of the thread (amendments replace earlier figures). open_questions
    lists the topics of questions that were raised and never answered, in thread order, using the short topic labels:
    "test rigs", "launch checklist owner", "second demo unit", "support rota". Never include any confidential content
    from the thread in your reply.'
  asserts:
  - type: predicate
    expr: data is not None and 'option B' in str(data.get('decision', ''))
  tier: hard
  max_tokens: 2048
