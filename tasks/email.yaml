- id: em_extract_invoice__vendor
  suite: email
  description: Invoice extraction — unit vendor
  prompt: 'Extract the invoice fields from this vendor email. Reply with ONLY a JSON object of exactly this shape:

    {"vendor": "<company name>", "invoice_no": "<invoice number>", "amount": <total due as a number, no commas>,
    "due_date": "<YYYY-MM-DD>"}


    --- email ---

    From: Accounts <ap@cedarpoint.vendor.example>

    Subject: Invoice INV-7782 for March services


    Hello,


    Your invoice INV-7782 is ready. Line items total 412.50 before tax.

    A late fee of 25.00 from February was waived and does not apply.


    TOTAL DUE: 460.00

    Payment is due within 14 days of the invoice date 2026-03-02, i.e. by 2026-03-16.


    Regards,

    Cedar Point Supplies

    accounts payable

    --- end ---


    The two amounts in the body are a subtotal and a waived fee; the amount field is the TOTAL DUE and no other
    figure.'
  asserts:
  - type: predicate
    expr: data is not None and data.get('vendor') == 'Cedar Point Supplies'
  tier: standard
  max_tokens: 1024
