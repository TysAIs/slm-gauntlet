- id: sum_changelog__set
  suite: summarize
  description: Config changelog — unit set of (field, from, to) triples
  prompt: 'List what changed between version A and version B. Reply with ONLY a JSON array of objects of exactly
    this shape:

    {"field": "<what changed>", "from": "<old value>", "to": "<new value>"}

    Include exactly the changed fields, in the order they appear in the document.


    --- version A ---

    timeout: 30 seconds

    retries: 2

    theme: light

    logging: basic


    --- version B ---

    timeout: 60 seconds

    retries: 2

    theme: dark

    logging: basic

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and {(d.get('field'), d.get('from'), d.get('to')) for d in data} == {('timeout', '30
      seconds', '60 seconds'), ('theme', 'light', 'dark')}
  tier: standard
  max_tokens: 768
