# Summarization fidelity suite (epoch 0.6.0, design P2 section 2.4).
#
# Doctrine: a summary is graded on SELECTION, EXTRACTION and COVERAGE -
# never on similarity to a reference summary. Every fixture plants its
# checkable facts; invented content fails an entity gate (a predicate over
# the numbers/dates in the output: every one must occur in the source).
# The exaggeration-trap headline (H2) is the canonical near-miss.
#
# Fixtures are synthetic; scripts/gen_summarize_tasks.py recomputes the
# planted sets (decisions, on-topic sentences, changelog triples) from the
# fixture data and asserts equality with this file.
# Validity proof: tests/test_validity_summarize.py.
- id: sum_meeting_decisions__set
  suite: summarize
  description: Extract the decisions from meeting notes — unit exact decision set (invented decision gates the set)
  prompt: 'Extract ONLY the decisions from these meeting notes. Reply with ONLY a JSON array containing the decision
    sentences, copied exactly as written (without their [S#] labels), in the order they appear.


    --- notes ---

    [S1] The team reviewed the draft roadmap for the spring release.

    [S2] Decision: the launch date moves to 2026-04-15.

    [S3] Ana presented the new onboarding flow and its metrics.

    [S4] Decision: the support rota gains a weekend shift.

    [S5] The group discussed venue options for the offsite.

    [S6] Decision: the legacy export feature is retired on 2026-05-01.

    [S7] Ben showed photos from the user study sessions.

    [S8] The meeting closed with a round of thanks.

    --- end ---'
  asserts:
  - type: predicate
    expr: 'data is not None and set(data) == {''Decision: the launch date moves to 2026-04-15.'', ''Decision: the
      support rota gains a weekend shift.'', ''Decision: the legacy export feature is retired on 2026-05-01.''}'
  tier: standard
  max_tokens: 768
- id: sum_meeting_decisions__count
  suite: summarize
  description: Extract the decisions — unit exactly three decisions
  prompt: 'Extract ONLY the decisions from these meeting notes. Reply with ONLY a JSON array containing the decision
    sentences, copied exactly as written (without their [S#] labels), in the order they appear.


    --- notes ---

    [S1] The team reviewed the draft roadmap for the spring release.

    [S2] Decision: the launch date moves to 2026-04-15.

    [S3] Ana presented the new onboarding flow and its metrics.

    [S4] Decision: the support rota gains a weekend shift.

    [S5] The group discussed venue options for the offsite.

    [S6] Decision: the legacy export feature is retired on 2026-05-01.

    [S7] Ben showed photos from the user study sessions.

    [S8] The meeting closed with a round of thanks.

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and len(data) == 3
  tier: standard
  max_tokens: 768
- id: sum_sentence_select__set
  suite: summarize
  description: Select the on-topic sentences — unit exact id set
  prompt: 'From this article, select the sentences that state FACTS ABOUT THE BRIDGE REPAIR PROJECT (its budget,
    schedule, or scope). There are exactly 3.

    Reply with ONLY a JSON array of their ids, like ["S1", "S4"].


    --- article ---

    [S1] The reservoir level rose slightly after the spring rain.

    [S2] The committee approved the budget of 48,000 for the bridge repair.

    [S3] Local schools announced a photography contest for students.

    [S4] Construction on the bridge begins on 2026-04-06 and lasts 6 weeks.

    [S5] A farmers market opens in the square every Saturday.

    [S6] The mayor thanked the volunteers at a short ceremony.

    [S7] The repair budget covers materials and two inspection visits.

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and set(data) == {'S2', 'S4', 'S7'}
  tier: standard
  max_tokens: 768
