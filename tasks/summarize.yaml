- id: sum_numbers_guard
  suite: summarize
  description: 'Numbers-guard brief: the entity gate IS the task (every number must exist in the source)'
  prompt: 'Write a brief of this note in 2 or 3 sentences.


    --- note ---

    Quarterly note. Revenue reached 1.25 million, up from 1.10 million last quarter. The team grew to 42 people.
    Churn stayed at 3.5 percent. The office lease runs until 2027.

    --- end ---


    Every number you write must come from the note exactly as written there. Invent no numbers.'
  asserts:
  - type: predicate
    expr: not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+|\d[\d,]*', out) if t.replace(',',
      '') not in ('1.25', '1.10', '42', '3.5', '2027')]
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: len(out.split()) >= 10
    weight: 1.0
  - type: predicate
    expr: sum(1 for t in ('1.25', '1.10', '42', '3.5', '2027') if t in out.replace(',', '')) >= 3
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: len([s for s in re.split(r'[.!?]+', out) if s.strip()]) >= 2
    weight: 1.0
  tier: hard
  max_tokens: 384
- id: sum_thread_catchup__decision
  suite: summarize
  description: Thread catch-up — unit decision copied exactly (gate)
  prompt: 'Catch up a teammate on this thread. Reply with ONLY a JSON object of exactly this shape:

    {"topic": "<the thread''s main topic, a few words>", "decision": "<the decision stated in the thread, copied
    exactly, or null if there is none>", "open_questions": <count of questions or requests in the thread that nobody
    answered>}


    --- thread ---

    Sam: I set up the staging server yesterday.

    Ana: The staging deploy works, but the login page is blank for some users.

    Sam: That is the known cache bug, I am on it.

    Ana: Decision: we hold the release until the login page is fixed.

    Ben: Marketing still needs the final screenshots by Friday.

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('decision') == 'we hold the release until the login page is fixed'
    must_pass: true
  tier: hard
  max_tokens: 768
