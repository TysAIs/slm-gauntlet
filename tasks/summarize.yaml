- id: sum_headline_pick
  suite: summarize
  description: Pick the accurate headline (exaggeration trap is the near-miss)
  prompt: 'Pick the headline that accurately summarises the article''s main news. Reply with ONLY its id.


    --- article ---

    [S1] The reservoir level rose slightly after the spring rain.

    [S2] The committee approved the budget of 48,000 for the bridge repair.

    [S3] Local schools announced a photography contest for students.

    [S4] Construction on the bridge begins on 2026-04-06 and lasts 6 weeks.

    [S5] A farmers market opens in the square every Saturday.

    [S6] The mayor thanked the volunteers at a short ceremony.

    [S7] The repair budget covers materials and two inspection visits.

    --- options ---

    [H1] City council approves bridge repair budget

    [H2] Bridge repair will bankrupt the city, engineers warn

    [H3] Farmers market opens in the square

    [H4] Reservoir levels rise after spring rain'
  asserts:
  - type: exact_match
    value: H1
  tier: standard
  max_tokens: 768
- id: sum_brief_coverage
  suite: summarize
  description: Status brief with planted-fact coverage + entity gate + bullet cap (RubricAssert-style)
  prompt: 'Write a brief of AT MOST 5 bullet lines (each starting with "- ") covering this status note.


    --- note ---

    Project Harborlight status, week of 2026-03-02. The migration to the new database finished on 2026-03-04, two
    days ahead of plan. Ana Ruiz leads the remaining API work. The open risk is the payment gateway: its sandbox
    tests failed twice this week. Budget spent so far is 61 percent of the total. The next milestone is the beta
    release on 2026-03-20.

    --- end ---


    Your brief must mention, in your own words: the database migration finishing (write "migration"), Ana Ruiz leading
    the API work (write "Ana Ruiz" and "API"), the payment gateway risk (write "payment gateway"), and the beta
    release date 2026-03-20.

    Use ONLY facts and numbers from the note - invent nothing.'
  asserts:
  - type: contains_any
    values:
    - migration
    weight: 1.0
  - type: contains_all
    values:
    - Ana Ruiz
    - API
    weight: 1.0
  - type: contains_any
    values:
    - payment gateway
    weight: 1.0
  - type: contains_any
    values:
    - '2026-03-20'
    weight: 1.0
  - type: predicate
    expr: not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+|\d[\d,]*', out) if t.replace(',',
      '') not in ('2026-03-02', '2026-03-04', '2026-03-20', '61')]
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: len([l for l in out.splitlines() if l.strip().startswith('-')]) <= 5
    weight: 1.0
  tier: standard
  max_tokens: 512
- id: sum_tldr_lock
  suite: summarize
  description: TL;DR under a hard word cap with two required points + entity gate
  prompt: 'Write a TL;DR of this news in AT MOST 30 words.


    --- news ---

    The city library will extend its opening hours from April. On weekdays it will close at 21:00 instead of 19:00,
    and it will also open on Sundays from 10:00 to 14:00. The change follows a survey in which 1,240 residents asked
    for longer hours. Two part-time staff will be hired to cover the extra shifts.

    --- end ---


    It must state that the library extends its opening hours (write "hours") and that it will open on Sundays (write
    "Sunday" or "Sundays"). Use only facts from the news.'
  asserts:
  - type: predicate
    expr: len(out.split()) <= 30
    weight: 1.0
  - type: contains_any
    values:
    - hours
    weight: 1.0
  - type: contains_any
    values:
    - Sunday
    - Sundays
    weight: 1.0
  - type: predicate
    expr: len(set(re.findall(r'\b(library|hours|sundays?|open|close|staff|residents|survey|weekday|shifts)\b', out.lower()))) >= 3
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: not [t for t in re.findall(r'\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+|\d[\d,]*', out) if t.replace(',',
      '') not in ('21:00', '19:00', '10:00', '14:00', '1240')]
    weight: 1.0
    must_pass: true
  tier: standard
  max_tokens: 256
- id: sum_multidoc_status__api
  suite: summarize
  description: Multi-doc status roll-up — unit api
  prompt: 'Three project status snippets follow. Build one status record. Reply with ONLY a JSON object of exactly
    this shape:

    {"api": "<status>", "web": "<status>", "mobile": "<status>", "overall": "<status>"}

    Each project status is the word used in its snippet (done, in progress, or blocked). overall is "at risk" if
    ANY project is blocked, otherwise "on track".


    --- api ---

    Status: done. The endpoints shipped last week.

    --- web ---

    Status: in progress. The redesign lands next week.

    --- mobile ---

    Status: blocked. Waiting on the store review.

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('api') == 'done'
  tier: standard
  max_tokens: 768
