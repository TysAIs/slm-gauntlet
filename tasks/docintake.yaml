- id: doc_noisy_ocr__record
  suite: docintake
  description: Noisy OCR invoice — unit de-noised key fields
  prompt: 'This invoice was OCR-scanned and contains typical OCR errors (0 read as O, 1 read as l, and similar).

    Extract it. Reply with ONLY a JSON object of exactly this shape:

    {"vendor": "<vendor name>", "invoice_no": "<invoice number>", "date": "<YYYY-MM-DD>", "total": <number>, "reference":
    "<reference or null>"}

    Correct the OCR errors in the values. If a field is unreadable, use null - never invent a value.


    --- scanned invoice ---

    Vend0r: Harbor Studio

    Inv0ice N0: 1NV-2081

    Date: 2O26-O3-O4

    Tota1: 96.5O USD

    Reference: (smudged, unreadab1e)

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('invoice_no') == 'INV-2081' and data.get('date') == '2026-03-04' and float(data.get('total'))
      == 96.5
  tier: hard
  max_tokens: 768
