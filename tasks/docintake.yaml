    "<reference or null>"}

    Correct the OCR errors in the values. If a field is unreadable, use null - never invent a value.


    --- scanned invoice ---

    Vend0r: Harbor Studio

    Inv0ice N0: 1NV-2081

    Date: 2O26-O3-O4

    Tota1: 96.5O USD

    Reference: (smudged, unreadab1e)

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('reference') is None
