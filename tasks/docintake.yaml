- id: doc_clause_find__notice
  suite: docintake
  description: Contract clause extraction — unit notice period (12-month cap is the distractor)
  prompt: 'Answer from this contract excerpt. Reply with ONLY a JSON object of exactly this shape:

    {"notice_period_days": <int>, "renewal_years": <int>}


    --- contract excerpt ---

    "Section 4 (Term): the initial term renews automatically for successive periods of 2 years unless either party
    objects.

    Section 7 (Termination): either party may terminate this agreement by giving written notice at least 90 days
    before the end of the current term.

    Section 9 (Liability): liability is capped at the fees paid in the preceding 12 months."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('notice_period_days') == 90
  tier: standard
  max_tokens: 768
- id: doc_clause_find__renewal
  suite: docintake
  description: Contract clause extraction — unit renewal period
  prompt: 'Answer from this contract excerpt. Reply with ONLY a JSON object of exactly this shape:

