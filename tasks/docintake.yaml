- id: doc_handwriting_transcript__fields
  suite: docintake
  description: Handwritten note — unit time and room (room written as 'Room 4B')
  prompt: 'Transcribe this photographed handwritten note into structured fields. The note uses abbreviations; expand
    them with this table:

    appt = appointment, mtg = meeting, w/ = with, rm = room, tom = tomorrow.

    Reply with ONLY a JSON object of exactly this shape:

    {"event": "<expanded event description>", "time": "<HH:MM>", "room": "<room>"}


    --- note (transcribed handwriting) ---

    "appt w/ Ana - project mtg, 14:30, rm 4B. Bring the draft."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('time') == '14:30' and data.get('room') == 'Room 4B'
  tier: standard
  max_tokens: 768
- id: doc_handwriting_transcript__expansion
  suite: docintake
  description: Handwritten note — unit abbreviations expanded per the given table
  prompt: 'Transcribe this photographed handwritten note into structured fields. The note uses abbreviations; expand
    them with this table:

    appt = appointment, mtg = meeting, w/ = with, rm = room, tom = tomorrow.

    Reply with ONLY a JSON object of exactly this shape:

    {"event": "<expanded event description>", "time": "<HH:MM>", "room": "<room>"}


    --- note (transcribed handwriting) ---

    "appt w/ Ana - project mtg, 14:30, rm 4B. Bring the draft."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and 'appointment with Ana' in data.get('event', '') and 'meeting' in data.get('event',
