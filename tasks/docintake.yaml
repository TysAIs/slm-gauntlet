# Document intake suite (epoch 0.6.0, design P2 section 2.3).
#
# AP/AR and records intake: invoices, receipts, forms, tables, clauses -
# including noisy OCR, redacted fields, and non-US number/date formats.
# Stated values are graded as stated (doc_totals_audit is the one task
# where recomputation IS the job). Redacted or unreadable fields must come
# back null; inventing a value fails a must_pass gate.
#
# doc_vision_bridge is NOT in this file: it is a cross-listed pointer to
# the OCR board's image fixtures. A text-only model must never score 0 for
# lacking vision, so the bridge ships as documentation, not a task.
#
# Fixtures are synthetic; scripts/gen_docintake_tasks.py recomputes the
# receipt/audit arithmetic and regenerates the OCR noise (seeded) and
# asserts equality with this file.
# Validity proof: tests/test_validity_docintake.py.
- id: doc_invoice_record__vendor
  suite: docintake
  description: Invoice to record — unit vendor
  prompt: 'Extract this invoice into a record. Reply with ONLY a JSON object of exactly this shape:

    {"vendor": "<vendor name>", "invoice_no": "<invoice number>", "date": "<YYYY-MM-DD>", "total": <number>, "currency":
    "<3-letter code>"}

    Use the values STATED in the document.


    --- invoice ---

    Vendor: Northwind Traders

    Invoice No: INV-4471

    Date: 2026-03-01

    Items: design work 300.00, hosting 112.00

    Total due: 412.00 USD

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('vendor') == 'Northwind Traders'
  tier: standard
  max_tokens: 768
