    Section 7 (Termination): either party may terminate this agreement by giving written notice at least 90 days
    before the end of the current term.

    Section 9 (Liability): liability is capped at the fees paid in the preceding 12 months."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('renewal_years') == 2
  tier: standard
  max_tokens: 768
