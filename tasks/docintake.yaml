- id: doc_receipt_lines__lines
  suite: docintake
  description: Receipt lines — unit set of (item, qty, unit_price)
  prompt: 'Extract this receipt. Reply with ONLY a JSON object of exactly this shape:

    {"lines": [{"item": "<name>", "qty": <int>, "unit_price": <number>}, ...], "total": <number>}

    --- receipt ---

    USB cable x2 @ 9.50 = 19.00

    Notebook A5 x3 @ 4.25 = 12.75

    Pen set x1 @ 6.00 = 6.00

    TOTAL: 37.75

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and {(d.get('item'), d.get('qty'), float(d.get('unit_price'))) for d in data.get('lines',
      [])} == {('USB cable', 2, 9.5), ('Notebook A5', 3, 4.25), ('Pen set', 1, 6.0)}
  tier: standard
  max_tokens: 768
