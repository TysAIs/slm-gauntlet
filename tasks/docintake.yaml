  tier: standard
  max_tokens: 768
- id: doc_totals_audit__stated
  suite: docintake
  description: Totals audit — unit stated total
  prompt: 'Audit this invoice''s arithmetic. Reply with ONLY a JSON object of exactly this shape:

    {"stated_total": <number>, "computed_total": <number>, "discrepancy": <number>}

    computed_total is the sum of the line items; discrepancy is stated_total minus computed_total.


    --- invoice ---

    Design work: 300.00

    Hosting: 112.00

    Support: 45.00

    Total due: 467.00

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and float(data.get('stated_total')) == 467.0
