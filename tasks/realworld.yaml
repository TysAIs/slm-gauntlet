- id: rw_invoice_deadline__discounted
  suite: realworld
  description: Early-payment discount deadline on a weekend — unit discounted amount
  prompt: |-
    Invoice issued 2026-02-25 for 8400.00, terms 2/10 net 30.

    Rules:
      - the 2% discount is available if payment is received on or before the 10th day
        after the issue date
      - if that 10th day falls on a Saturday or Sunday, the deadline moves to the
        PRECEDING business day
      - the discount applies to the invoice amount
      - a wire fee of 15.00 is added to the payment after the discount

    Reply with a single JSON object only:
    {"deadline": "<YYYY-MM-DD>", "discounted": <number with two decimals>, "payment": <number with two decimals>}
    where discounted is the invoice amount after the 2% discount and payment is the
    discounted amount plus the 15.00 wire fee.
  asserts:
    - type: predicate
      weight: 1.0
      expr: "isinstance(data, dict) and abs(float(data.get('discounted', -1)) - 8232.0) < 0.005"
  max_tokens: 384
  no_think: true

