- id: rw_room_conflicts__overlap_b24
  suite: realworld
  description: Find every booking conflict under overlap-or-buffer policy — unit B2/B4 overlap
  prompt: |-
    One room is booked (24-hour times, same day):
    B1 09:00-10:00
    B2 10:15-11:00
    B3 11:10-12:00
    B4 10:50-11:30

    Conflict policy: two bookings conflict if they OVERLAP at all, or if the gap
    between the end of the earlier one and the start of the later one is LESS THAN
    15 minutes. A gap of exactly 15 minutes is fine.

    Reply with a single JSON array only, listing every conflicting pair once, each pair
    as ["earlier_or_overlapping_id_first", "other_id"] with both ids as JSON strings,
    the list sorted by the first id then the second id. Use double quotes around the
    ids, for example [["B1", "B2"], ["B3", "B4"]].
  asserts:
    - type: predicate
      weight: 1.0
      expr: "isinstance(data, list) and {'B2', 'B4'} in [set(str(x) for x in p) for p in data if isinstance(p, list) and len(p) == 2]"
  max_tokens: 384
  no_think: true

