- id: rw_ledger_recon
  suite: realworld
  description: Reconcile two ledgers and write the discrepancy file, including a row missing from one side
  prompt: |-
    Reconcile ledger L2 against ledger L1. For each date, compare the amount in L2 with
    the amount in L1.

    L1: 2026-03-01 coffee 4.50 | 2026-03-03 fuel 62.10 | 2026-03-04 parking 9.00
    L2: 2026-03-01 coffee 4.50 | 2026-03-03 fuel 63.10 | 2026-03-04 parking 9.00 | 2026-03-05 toll 3.25

    Use the write_file tool to create "out/recon.csv" with this exact header:
    date,status,delta
    Then one row per discrepant date, sorted by date ascending, where status is
    "amount_diff" when L2 has a different amount than L1 and "missing_in_l1" when L2
    has a row L1 does not, and delta is (L2 amount - L1 amount) with two decimals
    (for a missing row, L1's amount counts as zero).
    Do not add blank lines.

    Then reply with exactly one line: "NET: <amount>", where amount is the sum of the
    deltas with two decimals.
  tools:
    - name: write_file
      description: Write a file in the workspace.
      parameters:
        type: object
        properties:
          path: {type: string}
          content: {type: string}
        required: [path, content]
  asserts:
    - type: predicate
      must_pass: true
      weight: 3.0
      expr: "any(abs(float(x) - 4.25) < 0.005 for x in re.findall(r'-?\\d+\\.\\d{2}', out))"
  state_asserts:
    - type: tool_called
      tool: write_file
      must_pass: true
      weight: 2.0
    - type: file_lines
      path: out/recon.csv
      must_pass: true
      weight: 3.0
      lines:
        - "date,status,delta"
        - "2026-03-03,amount_diff,1.00"
        - "2026-03-05,missing_in_l1,3.25"
  max_tokens: 768
  no_think: true

