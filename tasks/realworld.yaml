    Payroll rules for this week:
      - base rate 22.00/hour for the first 40 hours
      - overtime hours (beyond 40) pay 1.5x the base rate
      - tax is 12% of regular earnings and 20% of overtime earnings
      - a flat health premium of 85.00 is deducted after tax
    The employee worked 46 hours this week.

    Reply with exactly three lines and nothing else, all amounts with two decimals:
    GROSS: <amount>
    TAX: <amount>
    NET: <amount>
  asserts:
