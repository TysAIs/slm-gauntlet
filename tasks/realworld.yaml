- id: rw_ticket_priority__ids
  suite: realworld
  description: Order a support queue by severity, then age, then id — unit every id present once
  prompt: |-
    Sort this support queue. Sort keys, applied in this order:
      1. severity number ASCENDING (1 is most severe, so it is handled first)
      2. for equal severity, age in days DESCENDING (the ticket that is MORE days old
         is handled first)
      3. for equal severity and age, ticket id ASCENDING

    T-4 | severity 3 | 2 days old
    T-1 | severity 1 | 1 day old
    T-7 | severity 2 | 9 days old
    T-2 | severity 1 | 4 days old
    T-9 | severity 2 | 9 days old

    Reply with a single JSON array of the five ticket ids in order, nothing else,
    for example ["T-3", "T-1", "T-8", "T-5", "T-6"].
  asserts:
    - type: predicate
      weight: 1.0
      expr: "isinstance(data, list) and sorted(str(x) for x in data) == ['T-1', 'T-2', 'T-4', 'T-7', 'T-9']"
  max_tokens: 320
  no_think: true

