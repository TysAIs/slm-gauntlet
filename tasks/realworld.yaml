# Real-world suite: everyday agent work, graded on the OUTCOME.
#
# Why this suite exists: the 0.3 suites leaned on tool-calling puzzles. A model
# that ranks well there can still get a real chore wrong — a split bill, a
# refund under a policy, a file someone else has to read. Every task here is
# work a person actually hands an assistant, and every assert checks a
# number, an ordering, a parsed structure or a file's contents. No keyword
# credit: "84.00" cannot be guessed from the phrasing, and a JSON key must be
# in the right bucket.
#
# Grading rules used throughout:
#   * amounts are compared as NUMBERS parsed out of the answer, so "$59.00",
#     "59.00" and "USD 59.00" grade the same and a wrong 216.00 does not pass;
#   * where a decision is requested, the parsed JSON is compared field by
#     field, not searched for a word;
#   * the file task writes a real file and the sandbox is read back, so the
#     answer only counts if the work product exists.
#
# Validity proof: tests/test_realworld_validity.py runs a GOLD answer (must
# pass, full score) and a NEAR-MISS answer (must fail) through the real scorer
# for every task in this file. A task that a correct answer fails, or a
# plausible wrong answer passes, fails the test suite.
#
# 0.5.1 — SUB-ANSWER UNITS (see docs/AUDIT-TASK-VALIDITY-v0.5.md for the 0.5.0
# defect this repairs). A scenario that asks for several independent values used
# to be ONE task graded by several `must_pass` asserts, so a model that got 2 of
# 3 values right scored 0.00 and the scenario was a constant zero for every
# configuration in the corpus. Each independent value is now its own task, id
# `<scenario>__<unit>`, carrying the SAME prompt as the scenario so the model
# still has to produce the complete answer; the unit decides only which part of
# that answer it is graded on. Consequences, stated plainly:
#   * these units are correlated by construction — they share one generation —
#     so the suite's independent SCENARIO count is the number of distinct
#     prompts, not the number of tasks. Both counts are published.
#   * a unit carries exactly one assert, which therefore always gates its own
#     score; `must_pass` is kept for tasks where a structural assert (a written
#     file, a required tool call) makes the text asserts meaningless when it
#     fails.
#   * no task in this file is a composite "all of it correct" gate any more: a
#     composite that nobody passes is a constant zero and ranks nothing.

- id: rw_expense_split__subtotal
  suite: realworld
  description: Split a bill where tax is included and tip is pre-tax — unit pre-tax subtotal
  prompt: |-
    A team dinner receipt totals $216.00, and that total already includes 8% sales tax.
    House policy: tip 18% of the PRE-TAX subtotal. The guest pays the receipt and the
    tip together, and that whole amount is split equally by 4 people, so each person's
    share is (receipt + tip) / 4.

    Reply with exactly three lines and nothing else:
    SUBTOTAL: <amount>
    TIP: <amount>
    PER_PERSON: <amount>
    Write every amount with two decimals.
  asserts:
    - type: line_value
      weight: 1.0
      label: SUBTOTAL
      equals: 200.00
  max_tokens: 256
  no_think: true

