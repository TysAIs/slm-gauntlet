    A request fails at time 0 with HTTP 429 and a Retry-After header of 12 seconds.

    Client retry policy:
      - the first retry waits 2 seconds, and each later wait doubles (2, 4, 8, 16, 32, 64 ...)
      - no single wait may exceed 30 seconds (cap the wait, do not skip the retry)
      - at most 6 retries total
      - no retry may happen earlier than the Retry-After value

    Assume every retry fails again with no new Retry-After.

    Reply with a single JSON array only, the 6 retry times in seconds after time 0,
    in ascending order.
  asserts:
    - type: predicate
      weight: 1.0
      expr: "isinstance(data, list) and len(data) >= 1 and 12 <= float(data[0]) <= 30"
  max_tokens: 384
  no_think: true

