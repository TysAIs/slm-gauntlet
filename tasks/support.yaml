- id: st_rma_chain_warranty
  suite: support
  description: 'RMA chain, in-warranty branch: rma.json written with the right order + approval reply'
  prompt: 'You are the support agent handling a return. Order ORD-778 has already been looked up: the order exists,
    the item is a K-200 drive, and its warranty status is IN WARRANTY.

    Do these steps in order:

    1. Write a file rma.json (write_file tool) whose content is ONLY this JSON object: {"order_no": "ORD-778", "rma_created":
    true}

    2. Write a file reply.txt (write_file tool) whose content tells the customer their return was approved under
    warranty and gives the order number ORD-778.

    Then reply with the single word: done'
  asserts:
  - type: exact_match
    value: done
  tier: hard
  max_tokens: 512
  state_asserts:
  - type: file_lines
    path: rma.json
    lines:
    - '{"order_no": "ORD-778", "rma_created": true}'
    must_pass: true
    weight: 1.0
  - type: file_content
    path: reply.txt
    contains: ORD-778
    weight: 1.0
  - type: file_content
    path: reply.txt
    contains: approved
    weight: 1.0
  tools:
  - write_file
- id: st_rma_chain_expired
  suite: support
  description: 'RMA chain, out-of-warranty branch: denial note written, NO rma.json (wrong-branch creation gated by state_predicate)'
  prompt: 'You are the support agent handling a return. Order ORD-779 has already been looked up: the order exists,
    the item is a K-200 drive, and its warranty status is OUT OF WARRANTY.

    Do these steps in order:

    1. Write a file denial_note.txt (write_file tool) whose content tells the customer the return cannot be approved
    because the warranty has expired, and gives the order number ORD-779.

    Do NOT create any RMA for this order (no rma.json file).

    Then reply with the single word: done'
  asserts:
  - type: exact_match
    value: done
  # wrong-branch creation gate: an rma.json must NOT exist on this branch
  # (file absence is gradeable through the state_predicate files binding)
  - type: state_predicate
    expr: "'rma.json' not in files"
    weight: 2.0
    must_pass: true
  tier: hard
  max_tokens: 512
  state_asserts:
  - type: file_content
    path: denial_note.txt
    contains: ORD-779
    must_pass: true
    weight: 1.0
  - type: file_content
    path: denial_note.txt
    contains: expired
    weight: 1.0
  tools:
  - write_file
