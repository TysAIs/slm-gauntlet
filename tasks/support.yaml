- id: st_refund_decision__a_eligible
  suite: support
  description: Refund decision variant a — unit eligible
  prompt: "Refund policy:\n - Rule A (unopened, in window): unopened item, reported within 30 days of delivery ->\
    \ eligible, reason_code \"unopened_in_window\".\n - Rule B (opened, in window): opened item, reported within\
    \ 30 days -> not eligible, reason_code \"opened\".\n - Rule C (damaged): item arrived damaged, reported within\
    \ 60 days -> eligible, reason_code \"damaged_arrival\".\n - Rule D (expired): anything reported after its window\
    \ -> not eligible, reason_code \"expired\".\nApply the FIRST rule that matches, in the order C, A, B, D (damage\
    \ outranks the others).\n\n--- ticket (A) ---\n\"The headphones arrived unopened 10 days ago. I changed my mind\
    \ and want a refund.\"\n--- end ---\n\nReply with ONLY a JSON object of exactly this shape:\n{\"eligible\":\
    \ true or false, \"reason_code\": \"<code from the policy>\"}"
  asserts:
  - type: predicate
    expr: data is not None and data.get('eligible') == True
  tier: standard
  max_tokens: 768
