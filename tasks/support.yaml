- id: st_split_multi_issue__pairs
  suite: support
  description: Split a two-issue ticket — unit (category, sentence) pairs as a set
  prompt: 'This ticket contains TWO separate problems. The sentences are numbered. Split it into two sub-tickets.

    Reply with ONLY a JSON array of exactly two objects of this shape: {"category": "<category>", "summary_id":
    "<sentence id>"}

    Categories: billing, account, shipping, technical, other. summary_id is the id of the sentence that states that
    problem.


    --- ticket ---

    [S1] Hi, my March invoice charged me 59.99 twice.

    [S2] I would like one of the two charges refunded.

    [S3] Separately, the app crashes every time I open the reports tab.

    [S4] This started right after the 5.2 update.

    [S5] Thanks for your help.

    --- end ---'
  asserts:
