- id: st_kb_select
  suite: support
  description: KB article selection — exact id (plausible neighbours are the near-miss)
  prompt: 'A customer ticket says: "Since the update, the app closes whenever I open the reports tab. The dashboard
    and settings tabs work fine."

    Choose the ONE knowledge-base article that resolves this ticket. Reply with ONLY the article id (e.g. KB-3).


    [KB-1] Resetting your password from the login screen.

    [KB-2] The app crashes on the reports tab after the 5.2 update; clear the report cache in Settings > Storage
    to fix it.

    [KB-3] The dashboard loads slowly on large accounts; reduce the widget count.

    [KB-4] Exporting reports to CSV from the reports tab.

    [KB-5] Billing: updating the card on file for your subscription.'
  asserts:
  - type: exact_match
    value: KB-2
  tier: standard
  max_tokens: 768
- id: st_first_response
  suite: support
  description: Draft first response from a KB article (RubricAssert)
  prompt: 'Draft the first support response to this ticket, using the knowledge-base article below.


    --- ticket ---

    "Since the update, the app closes whenever I open the reports tab."


    --- KB-2 ---

    "If the app closes on the reports tab after the 5.2 update, clear the report cache: open Settings, then Storage,
    and tap Clear report cache. Then restart the app. The fix takes effect immediately and no data is lost."

    --- end ---


    Your draft must:

    - include all three resolution steps from the article, in your own words but naming each step: opening Settings,
    opening Storage, and clearing the report cache (write "Settings", "Storage" and "clear the report cache" or
    "clearing the report cache");

    - use ONLY facts from the ticket and the article - invent no numbers, versions, dates or names;

    - NOT promise a refund or a replacement;

    - be between 30 and 140 words.

    Write only the response body.'
  asserts:
  - type: contains_all
    values:
    - Settings
    - Storage
    weight: 1.0
  - type: contains_any
    values:
    - clear the report cache
    - clearing the report cache
    weight: 1.0
  - type: predicate
    expr: 'not re.search(r''\d+\s*(business\s+)?(days?|weeks?|months?|hours?|hrs?|minutes?|mins?)\b'', out.lower()) and not [t for t in re.findall(r''\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\$?\d[\d,]*\.\d+|\d+'', out) if t not in (''5.2'',) and not re.match(r''^[123]$'', t)]'
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: '(''refund'' not in out.lower() and ''replacement'' not in out.lower()) or bool(re.search(r''(?:\bnot\b|\bno\b|\bnever\b|\bcannot\b|\bcan not\b|\bcan\Wt\b|\bcould not\b|\bcouldn\Wt\b|\bwon\Wt\b|\bwill not\b|\bdo not\b|\bdon\Wt\b|\bdoes not\b|\bwithout\b|\bno longer\b)[^.!?\n]{0,50}?\b(refund|replacement)\b'', out.lower()))'
    weight: 1.0
    must_pass: true
  - type: predicate
    expr: 30 <= len(out.split()) <= 140
    weight: 1.0
  tier: standard
  max_tokens: 512
- id: st_escalate_decision__t1
  suite: support
  description: Escalation decision — unit T-1
  prompt: 'Decide, for each of these six tickets, whether it must be escalated to a senior agent.

    Escalation policy: escalate if the ticket (a) mentions a safety risk, (b) mentions legal action or a lawyer,
    (c) is from a VIP account, or (d) is the customer''s THIRD report of the same unresolved issue. Everything else
    stays with the first-line agent.

    Reply with ONLY a JSON object of exactly this shape:

    {"T-1": true/false, "T-2": true/false, "T-3": true/false, "T-4": true/false, "T-5": true/false, "T-6": true/false}


    [T-1] "The battery in my unit is swelling and smells hot." (regular account, first report)

    [T-2] "If this is not fixed I will have my lawyer contact you." (regular account, first report)

    [T-3] "Question about changing my billing address." (VIP account, first report)

    [T-4] "The export button is greyed out." (regular account, first report)

    [T-5] "Reporting the same sync failure again - this is the third time, still broken." (regular account, third
    report)

    [T-6] "How do I enable dark mode?" (regular account, first report)'
  asserts:
  - type: predicate
    expr: data is not None and data.get('T-1') == True
  tier: standard
  max_tokens: 768
