# Support-ticket agent suite (epoch 0.6.0, design P2 section 2.1).
#
# The helpdesk copilot job: classify, extract, decide under a published
# policy, pick the KB article, draft the first response, escalate, split,
# dedupe. 100% deterministic scoring with the existing assert vocabulary;
# the draft uses the RubricAssert pattern (points + entity gate + a
# no-refund-promise gate). Refund variants follow the scenario convention:
# each variant is its own scenario (st_refund_decision__a .. __d) whose
# units share that variant's prompt.
#
# st_rma_chain is realised against the current sandbox file tools (the
# sandbox has no order/warranty/RMA tools - see the build report): the
# lookup facts are given in the prompt, and the graded outcomes are the
# files the agent writes - rma.json on the in-warranty branch
# (scenario st_rma_chain_warranty), a denial note on the expired branch
# (scenario st_rma_chain_expired). File ABSENCE is gradeable via the
# state_predicate files binding, and the expired branch gates on it:
# creating an rma.json there fails the task.
#
# Fixtures are synthetic; scripts/gen_support_tasks.py recomputes the
# refund decisions, the SLA arithmetic and the escalation vector from the
# fixture data and asserts equality with this file.
# Validity proof: tests/test_validity_support.py.
- id: st_classify__category
  suite: support
  description: Ticket classification — unit category
  prompt: 'Classify this support ticket. Categories: billing, account, shipping, technical, other.

    Priority rules: "high" if the customer cannot use the product at all or mentions a payment deadline today; "medium"
    if something is broken but a workaround exists; "low" for questions and minor issues.

    Reply with ONLY a JSON object of exactly this shape:

    {"category": "<category>", "priority": "high" or "medium" or "low"}


    --- ticket T-101 ---

    "My card was charged twice for the March subscription and I need one of the charges removed."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('category') == 'billing'
  tier: standard
  max_tokens: 768
- id: st_classify__priority
  suite: support
  description: Ticket classification — unit priority (refund request, no deadline, product usable)
  prompt: 'Classify this support ticket. Categories: billing, account, shipping, technical, other.

    Priority rules: "high" if the customer cannot use the product at all or mentions a payment deadline today; "medium"
    if something is broken but a workaround exists; "low" for questions and minor issues.

    Reply with ONLY a JSON object of exactly this shape:

    {"category": "<category>", "priority": "high" or "medium" or "low"}


    --- ticket T-101 ---

    "My card was charged twice for the March subscription and I need one of the charges removed."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('priority') == 'low'
  tier: standard
  max_tokens: 768
- id: st_extract_ids__order_no
  suite: support
  description: Ticket field extraction — unit order_no
  prompt: 'Extract the fields from this ticket. Reply with ONLY a JSON object of exactly this shape:

    {"order_no": "<order number or null>", "error_code": "<error code or null>", "product": "<product name>", "purchase_date":
    "<YYYY-MM-DD or null>"}

    If a field is not stated anywhere in the ticket, use null - do not guess it.


    --- ticket ---

    "Hi, I bought the K-200 drive (order ORD-5531) last month and it worked fine until yesterday.

    Now the app just shows a spinner forever. Restarting did not help. Please advise."

    --- end ---'
  asserts:
  - type: predicate
    expr: data is not None and data.get('order_no') == 'ORD-5531'
  tier: standard
  max_tokens: 768
