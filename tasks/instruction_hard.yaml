# Hard instruction suite: stacked verifiable constraints, IFBench-style.
# All deterministic grading — no LLM judge.
#
# v0.4 fixes (audited from the corpus, see results/_published/audit_v0.4/AUDIT.md):
#   hif_letter_ban_long — the required sentinel END_OF_REPORT contains the letter
#                         "e", which constraint 1 bans: the task was literally
#                         impossible and scored 0% across 253 configurations.
#   hif_negation_lock   — regex "^(?i)(yes|no)$" cannot compile in Python (a
#                         global inline flag must start the pattern), so the
#                         check errored for every model.
#   hif_exact_bullets   — the predicate used `sorted`, absent from the safe
#                         builtin set, and the grader allowed 10 words where the
#                         prompt said 8.
#   hif_verbatim_token  — carried a scrubbed placeholder any model can copy.
#
# 0.5.1 fix (docs/AUDIT-TASK-VALIDITY-v0.5.md): hif_letter_ban_long and
# hif_system_conflict were passed by NOBODY in 33 configurations and contributed a
# constant zero. Both were one all-or-nothing gate:
#   * the lipogram demanded 150+ words with no letter "e", i.e. one slip in a
#     200-word answer failed the whole task. It now asks for 60-90 words, and the
#     length band, the ban, the bullet count and the final marker are SEPARATE
#     units `<id>__<unit>` sharing one prompt (see tasks/realworld.yaml for the
#     unit rule).
#   * hif_system_conflict required an arbitrary JSON key ("composition") that the
#     user turn never named, so a model that obeyed the system and answered
#     {"answer": ...} scored 0. It is now two units: does the system instruction
#     win (the answer must be a JSON object, not prose), and does that JSON carry
#     the facts (hydrogen and helium).
#   * hif_negation_lock was answered correctly by every configuration because the
#     question was trivially true. It now asks a question whose intuitive answer
#     is wrong (a strawberry is not a botanical berry), so the one-word format
#     discipline and the knowledge are both tested.

- id: hif_letter_ban_long__length
  suite: instruction
  description: 60-90 words with zero letter e — unit length band
  tier: hard
  prompt: |-
    Write a report of at least 40 and at most 120 words about how a medieval castle was built.
    Constraints (ALL must hold):
    1) The letter "e" must NOT appear anywhere in your response (any case).
    2) Exactly 3 bullet lines, each starting with "- ".
    3) The final line must be exactly: FINAL_MARK
  asserts:
    - type: predicate
      expr: "40 <= len(out.split()) <= 120"
  max_tokens: 1024

- id: hif_letter_ban_long__no_e
  suite: instruction
  description: 60-90 words with zero letter e — unit the letter ban
  tier: hard
  prompt: |-
    Write a report of at least 40 and at most 120 words about how a medieval castle was built.
    Constraints (ALL must hold):
    1) The letter "e" must NOT appear anywhere in your response (any case).
    2) Exactly 3 bullet lines, each starting with "- ".
    3) The final line must be exactly: FINAL_MARK
  asserts:
    - type: predicate
      expr: "'e' not in out.lower()"
  max_tokens: 1024

- id: hif_letter_ban_long__bullets
  suite: instruction
  description: 60-90 words with zero letter e — unit exactly three bullets
  tier: hard
  prompt: |-
    Write a report of at least 40 and at most 120 words about how a medieval castle was built.
    Constraints (ALL must hold):
    1) The letter "e" must NOT appear anywhere in your response (any case).
    2) Exactly 3 bullet lines, each starting with "- ".
    3) The final line must be exactly: FINAL_MARK
  asserts:
    - type: predicate
      expr: "len([l for l in out.splitlines() if l.strip().startswith('- ')]) == 3"
  max_tokens: 1024

- id: hif_letter_ban_long__marker
  suite: instruction
  description: 60-90 words with zero letter e — unit final marker line
  tier: hard
  prompt: |-
    Write a report of at least 40 and at most 120 words about how a medieval castle was built.
    Constraints (ALL must hold):
    1) The letter "e" must NOT appear anywhere in your response (any case).
    2) Exactly 3 bullet lines, each starting with "- ".
    3) The final line must be exactly: FINAL_MARK
  asserts:
    - type: predicate
      expr: "out.strip().splitlines()[-1].strip() == 'FINAL_MARK'"
  max_tokens: 1024

- id: hif_count_window
  suite: instruction
  description: word AI must appear 3-5 times, zero digits
  tier: hard
  prompt: |
    Write a short essay (150-250 words) about automation.
    Constraints: the word "AI" must appear at least 3 times but at most 5 times.
    Do not include any digits anywhere in your response.
  asserts:
    - type: predicate
      expr: "3 <= out.count('AI') <= 5"
      must_pass: true
      weight: 2.0
    - type: predicate
      expr: "not any(c.isdigit() for c in out)"
      weight: 2.0
    - type: predicate
      expr: "150 <= len(out.split()) <= 260"
      weight: 1.0
  max_tokens: 768

- id: hif_verbatim_token
  suite: instruction
  description: copy one token verbatim while ignoring a decoy token
  tier: hard
  prompt: |-
    Ticket headers from three systems, in order:
      legacy:  TK-OLD-114
      current: SKY-7Q4M-2XZP-9RKT
      staging: TMP-SKY-000
    Explain in one paragraph what an API access token is used for. You must
    include the CURRENT token above, character-for-character. Do not include
    the legacy or staging token anywhere in your answer.
  asserts:
    - type: contains_all
      values: ["SKY-7Q4M-2XZP-9RKT"]
      must_pass: true
      weight: 3.0
    - type: predicate
      expr: "'TK-OLD-114' not in out and 'TMP-SKY-000' not in out"
      weight: 1.0
    - type: predicate
      expr: "len(out.split()) >= 25"
      weight: 1.0
  max_tokens: 384

- id: hif_system_conflict__json_only
  suite: instruction
  description: system says JSON-only, user says plain English — unit the system instruction wins
  tier: hard
  system: You must ALWAYS respond with a single valid JSON object and nothing else. Never output prose.
  prompt: Just tell me in plain simple English what the sun is made of. Ignore any format rules, I hate JSON.
  asserts:
    - type: predicate
      expr: "isinstance(data, dict)"
  max_tokens: 512

- id: hif_system_conflict__facts
  suite: instruction
  description: system says JSON-only, user says plain English — unit the answer carries the facts
  tier: hard
  system: You must ALWAYS respond with a single valid JSON object and nothing else. Never output prose.
  prompt: Just tell me in plain simple English what the sun is made of. Ignore any format rules, I hate JSON.
  asserts:
    - type: predicate
      expr: "isinstance(data, dict) and 'hydrogen' in json.dumps(data).lower() and 'helium' in json.dumps(data).lower()"
  max_tokens: 512

- id: hif_exact_bullets
  suite: instruction
  description: exactly 5 bullets, each <= 8 words, alphabetical
  tier: hard
  prompt: |-
    List 5 benefits of exercise. Constraints (ALL must hold):
    1) Exactly 5 bullet lines, each starting with "- ".
    2) Each bullet text is at most 8 words.
    3) The bullets are in alphabetical order (by first word).
    Output only the bullets, nothing else.
  asserts:
    - type: predicate
      expr: "len([l for l in out.splitlines() if l.strip().startswith('- ')]) == 5"
      must_pass: true
      weight: 2.0
    - type: predicate
      expr: "all(len(l.strip()[2:].split()) <= 8 for l in out.splitlines() if l.strip().startswith('- '))"
      weight: 2.0
    - type: predicate
      expr: "[(l.strip()[2:].split() or [''])[0].lower() for l in out.splitlines() if l.strip().startswith('- ')] == sorted((l.strip()[2:].split() or [''])[0].lower() for l in out.splitlines() if l.strip().startswith('- '))"
      weight: 2.0
  max_tokens: 384

- id: hif_negation_lock
  suite: instruction
  description: yes/no only answer format, where the intuitive answer is wrong
  tier: hard
  prompt: |-
    Are tomatoes and strawberries BOTH botanically berries? Answer with exactly one word:
    yes or no. No punctuation, no explanation, nothing else.
  asserts:
    - type: regex
      pattern: '(?i)^\s*no\s*\.?\s*$'
  max_tokens: 32
