[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-gauntlet"
version = "0.1.0"
description = "Gauntlet benchmark for small (sub-12B) language models: agent tool-use, structured output, retrieval, coding, instruction-following, and throughput."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pytest-asyncio>=0.23"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools.packages.find]
include = ["gauntlet*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# llama.cpp is vendored (a submodule pointer), and linting someone else's C++
# repo's python helpers is noise: `ruff check .` in CI must be about our code.
extend-exclude = ["llama.cpp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP031 (printf-style "%s" formatting) is a style preference: this repo has a lot of
# multi-line %-format log lines, and rewriting them buys nothing. Without this the
# gate also flips red whenever the unpinned ruff in CI adds a case.
ignore = ["UP031"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
